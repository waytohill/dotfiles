# =========================================================
#  Kitty Config - managed
# =========================================================

# === 字体 ===
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.0

# 中文 fallback
symbol_map U+4E00-U+9FFF,U+3400-U+4DBF LXGW WenKai
# Nerd Font 图标
symbol_map U+E0A0-U+E0A3,U+E0B0-U+E0B3 JetBrains Mono Nerd Font
symbol_map U+2764,U+F000-U+F9FF JetBrains Mono Nerd Font

# === 主题（通过 ktheme 函数切换）===
include themes/current.conf

# === Tab 栏 ===
tab_bar_edge            bottom
tab_bar_style           slant
tab_bar_margin_height   0.5 0.5
tab_title_template      " {fmt.fg.gray}{index}  {fmt.fg.tab}{title} "
tab_bar_min_tabs        1
tab_activity_symbol     none
tab_switch_strategy     previous

# === 外观 ===
hide_window_decorations yes
background_opacity      0.85
background_blur         20
cursor_shape            beam
cursor_blink_interval   0.5
enable_audio_bell       no
window_padding_width    8
cursorline              yes

# === 窗口分割 ===
map ctrl+shift+enter launch --location=hsplit --cwd=current
map ctrl+shift+\     launch --location=vsplit --cwd=current
map ctrl+shift+]     next_window
map ctrl+shift+[     previous_window

# === Tab 管理 ===
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+w     close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab

# === 字体大小 ===
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
