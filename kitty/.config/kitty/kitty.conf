# =========================================================
#  Kitty Config - managed
# =========================================================

# === 输入法 ===
linux_display_server x11
env GLFW_IM_MODULE=ibus

# === 字体 ===
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.0

# 中文 fallback（含 CJK 标点 U+3000-U+303F 和全角符号 U+FF00-U+FFEF）
symbol_map U+3000-U+303F,U+3400-U+4DBF,U+4E00-U+9FFF,U+FF00-U+FFEF LXGW WenKai
# Nerd Font 图标（U+E000-U+FEFF，避免覆盖全角字符区 U+FF00-U+FFEF）
symbol_map U+2764,U+E000-U+FEFF,U+F0000-U+FFFFF Symbols Nerd Font

# === 主题（通过 ktheme 函数切换）===
include themes/current.conf

# === Tab 栏 ===
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_margin_height   0.5 0.5
tab_title_template      " {index} "
tab_bar_min_tabs        2
tab_activity_symbol     none
tab_switch_strategy     previous
active_tab_font_style   bold
inactive_tab_font_style normal

# === 外观 ===
hide_window_decorations yes
background_opacity      0.85
background_blur         20
cursor_shape            beam
cursor_blink_interval   0.5
enable_audio_bell       no
window_padding_width    8
cursorline              yes

# === 窗口分割 ===
map ctrl+shift+enter launch --location=hsplit --cwd=current
map ctrl+shift+\     launch --location=vsplit --cwd=current
map ctrl+shift+]     next_window
map ctrl+shift+[     previous_window

# === Tab 管理 ===
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+w     close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab

# === 字体大小 ===
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0

# === Shell integration ===
shell_integration enabled
allow_hyperlinks yes
allow_remote_control yes
listen_on unix:/tmp/kitty-socket
